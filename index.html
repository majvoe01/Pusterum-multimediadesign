<!DOCTYPE html>

        <!-- Navigation -->
        <nav class="navigation" aria-label="Hovednavigation">
            <ul>
                <li><a href="index.html" aria-current="page">Forside</a></li>

            </ul>

        <!-- Burgermenu til tablet og mobil-->
         <details class="mobil-menu">

                <span class="burger-icon" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                </span>

            <nav aria-label="Burgermenu">

                </ul>

        <div class="søgefelt">
            <input type="checkbox" id="vis-søg" class="søg-toggle">
            <label for="vis-søg" class="søg-ikon">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="30" height="30">
                    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 16L21 21" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span class="visuelt-skjult">Vis eller skjul søgefelt</span>
            </label>
            <div class="søg-input">
                <label for="søgning" class="visuelt-skjult">Søg på Pusterum</label>
                <input type="search" id="søgning" name="søgning" placeholder="Søg...">
            </div>
